name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast feedback: formatting and lint gates run once on Linux. gdstrict is a
  # strict formatter and linter, so its own source is held to the same bar.
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The format and lint paths are pure Rust with no Godot dependency, so they
  # build and test on all three desktop targets gdstrict ships binaries for.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace --all-targets
      - name: test
        run: cargo test --workspace

  # Strict-mode acceptance gate. The strict layer shells out to a real Godot
  # binary, so the live `gdstrict_strict` / `check` tests are skipped on the
  # `test` matrix above (no Godot there). This job installs a PINNED Godot and
  # runs the suite with it on PATH, so the untyped-fails / clean-passes
  # acceptance tests actually execute. Godot's stderr is an unstable contract
  # (PLAN.md §7), so the version is pinned and bumped deliberately alongside the
  # diagnostic parser — never floated to "latest".
  strict:
    # NB: the `env` context is not available in a job's `name`, so the version
    # is written literally here and kept in sync with GODOT_VERSION below.
    name: strict acceptance (Godot 4.6.2)
    runs-on: ubuntu-latest
    env:
      # Pinned Godot version. Must match the parser's supported release
      # (see crates/gdstrict-strict/src/lib.rs) and the fixtures' 4.6 features.
      GODOT_VERSION: 4.6.2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Godot (headless)
        uses: ./.github/actions/install-godot
        with:
          godot-version: ${{ env.GODOT_VERSION }}
      - name: test (strict tests run live against pinned Godot)
        # GODOT is set in GITHUB_ENV by the install-godot action; the strict
        # acceptance tests fail (not skip) if it is missing or misbehaves.
        run: cargo test --workspace

  # Self-test of the composite action consumers use. The cargo suite never
  # exercises action.yml, so its install path — the release installer, the
  # separate pwsh branch for Windows, and the GITHUB_PATH wiring that makes
  # `gdstrict` resolve in later steps — would otherwise only break in someone
  # else's repo. Runs on all three OSes against a fixture that is known
  # format- and lint-clean.
  #
  # NB: install-method 'prebuilt' installs the latest RELEASE, not this
  # checkout. That is deliberate: this job verifies the action wiring, and the
  # jobs above already cover the current source.
  action:
    name: action self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run the action (prebuilt install path)
        id: gdstrict
        uses: ./
        with:
          working-directory: fixtures/strict_clean_project
      - name: Assert the version output is populated
        shell: bash
        run: |
          set -euo pipefail
          v='${{ steps.gdstrict.outputs.gdstrict-version }}'
          echo "action reported version: $v"
          # Guards the regression where the output was wired to a step that
          # only ran under cargo-install, so prebuilt runs reported nothing.
          case "$v" in
            'gdstrict '*) ;;
            *) echo "unexpected gdstrict-version output: '$v'" >&2; exit 1 ;;
          esac
