name: 'Install Godot (headless)'
description: >
  Download and install a pinned Godot headless binary on Linux.
  Sets GODOT=/usr/local/bin/godot in GITHUB_ENV so subsequent steps find it.

inputs:
  godot-version:
    description: 'Godot release version to install, e.g. 4.6.2'
    required: true

runs:
  using: composite
  steps:
    - name: Install Godot ${{ inputs.godot-version }}
      shell: bash
      run: |
        set -euo pipefail
        GODOT_VERSION="${{ inputs.godot-version }}"
        base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
        zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        curl -fsSL "${base}/${zip}" -o /tmp/godot.zip
        unzip -q /tmp/godot.zip -d /tmp/godot
        sudo install -m755 \
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
          /usr/local/bin/godot
        echo "GODOT=/usr/local/bin/godot" >> "$GITHUB_ENV"
        godot --version
