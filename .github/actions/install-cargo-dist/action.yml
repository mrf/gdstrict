name: Install cargo-dist
description: Install the pinned cargo-dist release on the current runner (Linux, macOS, or Windows).

runs:
  using: composite
  steps:
    - name: Install cargo-dist (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf \
          https://github.com/axodotdev/cargo-dist/releases/download/v0.22.1/cargo-dist-installer.sh \
          | sh
    - name: Install cargo-dist (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: irm https://github.com/axodotdev/cargo-dist/releases/download/v0.22.1/cargo-dist-installer.ps1 | iex
