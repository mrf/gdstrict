[package]
name = "gdstrict-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "gdstrict command-line interface: format, --check, --diff"

[[bin]]
name = "gdstrict"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
similar = "3"
walkdir = "2"
# The formatter engine. The CLI delegates all source-level formatting here.
# NOTE (godot-linter-phase1-formatter-i7d.5): gdstrict-format does not yet expose
# a source-level `format(&str) -> String` entry point (only the document IR +
# renderer in `gdstrict_format::doc`). The CST -> Doc lowering is owned by a
# sibling task. `src/format.rs` isolates the seam so wiring the real engine in is
# a one-line change. See the deferral note there.
gdstrict-format = { path = "../gdstrict-format" }
