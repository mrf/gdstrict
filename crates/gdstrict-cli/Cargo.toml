[package]
name = "gdstrict"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "gdstrict command-line interface: format, --check, --diff"

[[bin]]
name = "gdstrict"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
similar = "3"
# ripgrep's path walker: gitignore semantics + nested ignore files + a custom
# .gdignore. Supersedes the previous minimal walkdir-based ignore logic.
ignore = "0.4"
# Config discovery: parse the single-knob gdstrict.toml (line-length).
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# `complexity --format json`: the machine-readable report CRAP tooling consumes.
serde_json = "1"
# The formatter engine. The CLI delegates all source-level formatting here via
# `src/format.rs`, threading the resolved line length in as the target width.
gdstrict-format = { path = "../gdstrict-format" }
# The syntactic style linter (CST naming rules). `check` aggregates its findings.
gdstrict-lint = { path = "../gdstrict-lint" }
# The strict-typing layer: drives a headless Godot binary to surface UNSAFE_*/
# UNTYPED_DECLARATION diagnostics. `check` runs this unless `--no-strict`.
gdstrict-strict = { path = "../gdstrict-strict" }
