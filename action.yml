name: 'gdstrict'
description: >
  Install gdstrict and run format --check, lint, and/or check on a GDScript
  project. Optionally installs a pinned Godot binary for the strict-typing
  check command (Linux runners only).

inputs:
  version:
    description: >
      Which gdstrict to install.  'latest' takes the newest release.  A
      release tag such as 'v0.1.0' pins to that release.  Under
      install-method 'cargo-install' this is a git ref instead (branch, tag,
      or commit SHA), and 'latest' is treated as 'main'.
    required: false
    default: 'latest'
  install-method:
    description: >
      How to install gdstrict.  'prebuilt' (default) downloads a static
      binary from the GitHub release — no Rust toolchain, a few seconds.
      'cargo-install' builds from source, which is slower but can install an
      arbitrary git ref.
    required: false
    default: 'prebuilt'
  install-godot:
    description: >
      Install a headless Godot binary so the check command can run the
      engine's own strict-typing analyzer.  Only works on Linux runners.
      Must be 'true' when run-check is 'true'.
    required: false
    default: 'false'
  godot-version:
    description: >
      Godot release version to install, e.g. '4.6.2'.  This should be pinned
      to the version the project's gdstrict.toml was tuned for.  Bumping it is
      a deliberate act — Godot's diagnostic output is an unstable contract and
      a new release may change which warnings fire.
    required: false
    default: '4.6.2'
  run-format-check:
    description: 'Run gdstrict format --check (exits 1 if any file would change).'
    required: false
    default: 'true'
  run-lint:
    description: 'Run gdstrict lint (syntactic naming rules).'
    required: false
    default: 'true'
  run-check:
    description: >
      Run gdstrict check (strict-typing enforcement via headless Godot).
      Requires install-godot: true.
    required: false
    default: 'false'
  working-directory:
    description: 'Directory to run gdstrict commands in (must be a Godot project root).'
    required: false
    default: '.'

outputs:
  gdstrict-version:
    description: 'The installed gdstrict version string.'
    value: ${{ steps.resolve-version.outputs.version }}

runs:
  using: composite
  steps:
    # --- prebuilt: download a static binary from the release (the fast path) ---

    - name: Install gdstrict (prebuilt, Linux/macOS)
      if: inputs.install-method == 'prebuilt' && runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        ver='${{ inputs.version }}'
        if [ "$ver" = 'latest' ] || [ "$ver" = 'main' ]; then
          url='https://github.com/mrf/gdstrict/releases/latest/download/gdstrict-installer.sh'
        else
          url="https://github.com/mrf/gdstrict/releases/download/${ver}/gdstrict-installer.sh"
        fi
        curl --proto '=https' --tlsv1.2 -LsSf "$url" | sh
        # The installer targets CARGO_HOME; make sure that bin dir is on PATH
        # for the run steps below even when no Rust toolchain is present.
        echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

    - name: Install gdstrict (prebuilt, Windows)
      if: inputs.install-method == 'prebuilt' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $ver = '${{ inputs.version }}'
        if ($ver -eq 'latest' -or $ver -eq 'main') {
          $url = 'https://github.com/mrf/gdstrict/releases/latest/download/gdstrict-installer.ps1'
        } else {
          $url = "https://github.com/mrf/gdstrict/releases/download/$ver/gdstrict-installer.ps1"
        }
        irm $url | iex
        $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }
        "$cargoHome\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

    # --- cargo-install: build from source (arbitrary git refs) ---

    - name: Install Rust toolchain (cargo-install method)
      if: inputs.install-method == 'cargo-install'
      uses: dtolnay/rust-toolchain@stable

    - name: Install gdstrict (from source)
      if: inputs.install-method == 'cargo-install'
      shell: bash
      run: |
        set -euo pipefail
        ver='${{ inputs.version }}'
        # 'latest' is a release concept; for a git-ref install it means main.
        if [ "$ver" = 'latest' ]; then ver='main'; fi
        cargo install \
          --git https://github.com/mrf/gdstrict \
          --rev "$ver" \
          --locked \
          gdstrict

    - name: Record installed version
      id: resolve-version
      shell: bash
      run: echo "version=$(gdstrict --version 2>&1 || echo unknown)" >> "$GITHUB_OUTPUT"

    - name: Install Godot ${{ inputs.godot-version }} (headless, Linux only)
      if: inputs.install-godot == 'true'
      uses: ./.github/actions/install-godot
      with:
        godot-version: ${{ inputs.godot-version }}

    - name: gdstrict format --check
      if: inputs.run-format-check == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: gdstrict format --check .

    - name: gdstrict lint
      if: inputs.run-lint == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: gdstrict lint .

    - name: gdstrict check
      if: inputs.run-check == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: gdstrict check .
